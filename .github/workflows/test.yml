name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Run skill tests
        run: |
          found=0
          while IFS= read -r t; do
            echo "::group::$t"
            python3 "$t"
            echo "::endgroup::"
            found=1
          done < <(find skills -path '*/tests/test_scripts.py' | sort)
          if [ "$found" = "0" ]; then echo "no skill tests found"; fi
